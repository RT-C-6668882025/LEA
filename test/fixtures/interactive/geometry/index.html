<!DOCTYPE html><html><head><meta charset="utf-8"><title>加载中…</title>
<link rel="stylesheet" href="assets/jsxgraph.css">
<style>body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:24px;background:#fffdf8;color:#292524}#box{width:560px;height:420px;border:1px solid #d6ccb8;border-radius:8px;background:#fff}p{color:#78716c}</style>
</head><body>
<h2>动态几何（JSXGraph）：拖动三个点</h2>
<p>拖动三角形的顶点，边长实时更新。</p>
<div id="box" class="jxgbox"></div>
<script src="assets/jsxgraphcore.js"></script>
<script>
try {
  var brd = JXG.JSXGraph.initBoard('box', { boundingbox: [-1, 5, 6, -1], axis: true, showCopyright: false });
  var A = brd.create('point', [1, 3], { name: 'A', size: 4 });
  var B = brd.create('point', [4, 1], { name: 'B', size: 4 });
  var C = brd.create('point', [2, 4], { name: 'C', size: 4 });
  brd.create('polygon', [A, B, C], { fillColor: '#d97706', fillOpacity: 0.15 });
  setTimeout(function () { document.title = 'GEOMETRY_OK'; }, 500);
} catch (e) { document.title = 'GEOERR:' + e.message; }
</script></body></html>
