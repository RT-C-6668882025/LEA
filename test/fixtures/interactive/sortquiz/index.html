<!DOCTYPE html><html><head><meta charset="utf-8"><title>加载中…</title>
<style>body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:24px;background:#fffdf8;color:#292524}
#list{max-width:420px}.item{background:#fff;border:1px solid #d6ccb8;border-radius:8px;padding:12px 16px;margin:8px 0;cursor:grab;font-size:15px}
.item.drag{opacity:.5}.ok{border-color:#22c55e;background:#f0fdf4}p{color:#78716c}</style>
</head><body>
<h2>排序练习：把步骤拖成正确顺序</h2>
<p>拖动卡片排列"泡茶"的正确步骤。</p>
<div id="list">
  <div class="item" data-k="3">把茶倒入杯中</div>
  <div class="item" data-k="1">烧开水</div>
  <div class="item" data-k="4">等 2 分钟后饮用</div>
  <div class="item" data-k="2">放茶叶进茶壶</div>
</div>
<div id="msg" style="font-weight:600;margin-top:14px"></div>
<script src="assets/Sortable.min.js"></script>
<script>
try {
  Sortable.create(document.getElementById('list'), {
    animation: 150,
    onEnd: function () {
      var ks = [].map.call(document.querySelectorAll('.item'), function (el) { return el.dataset.k; }).join('');
      if (ks === '1234') { document.getElementById('msg').textContent = '✓ 顺序正确！'; document.querySelectorAll('.item').forEach(function (el) { el.classList.add('ok'); }); document.title = 'SORT_完成'; }
    }
  });
  setTimeout(function () { document.title = 'SORT_OK'; }, 400);
} catch (e) { document.body.innerHTML += '<p style="color:red">初始化失败: ' + e.message + '</p>'; }
</script></body></html>
